spring.application.name=carelink-has
server.port=8080

# Active Profile default: dev (uses H2 in-memory with console enabled)
spring.datasource.url=jdbc:h2:mem:carelinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console enabled at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CareLink Operational Policies
carelink.policy.freshness-threshold-minutes=15
carelink.policy.stale-threshold-minutes=30
carelink.policy.procedure-delay-threshold-minutes=20
carelink.policy.referral-timeout-minutes=10
